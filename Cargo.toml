[package]
name = "quiz-race"
version = "2.0.0"
edition = "2021"
description = "Midterm Showdown – class quiz race: host screen + built-in LAN server"

[dependencies]
macroquad = "0.4.14"
tiny_http = "0.12"
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
